name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: adityakumar5492

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#22C55E&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
            dist/github-contribution-grid-snake-dark.svg?color_snake=#22C55E&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

      - name: Push Snake to gh-pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
